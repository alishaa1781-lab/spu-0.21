
name: Build SPU 0.21

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod
        working-directory: spu-1.21.11
        run: gradle build

      - name: Prepare JAR
        run: |
          mkdir -p output
          find spu-1.21.11/build/libs -maxdepth 1 -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} output/spu-0.21.jar \;
          test -f output/spu-0.21.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spu-0.21
          path: output/spu-0.21.jar
